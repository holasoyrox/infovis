<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roflix en datos</title>
  <style>
    :root {
      --netflix-red: #e50914;
      --negro: #141414;
      --gris: #808080;
      --gris-claro: #b3b3b3;
      --blanco: #ffffff;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      line-height: 1.5;
      background: var(--negro);
      color: var(--blanco);
    }
    h1 {
      margin-bottom: 0.25rem;
      color: var(--netflix-red);
      letter-spacing: 0.5px;
    }
    .intro { color: var(--gris-claro); margin-bottom: 3rem; }
    section {
      margin-bottom: 4rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--gris);
    }
    section h2 {
      margin-bottom: 1rem;
      color: var(--blanco);
      border-left: 4px solid var(--netflix-red);
      padding-left: 0.75rem;
    }
    .viz-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      background: #1f1f1f;
      border: 1px dashed var(--gris);
      color: var(--gris-claro);
      margin-bottom: 1rem;
    }
    .interpretacion { margin-top: 1rem; color: var(--gris-claro); }
    .fuente { font-size: 0.85rem; color: var(--gris); }
    a { color: var(--netflix-red); }
  </style>
</head>
<body>

  <h1>Mi Netflix en datos</h1>
  <p class="intro">
    <!-- Motivación: por qué elegiste este dataset, qué período cubre, qué te interesaba descubrir -->
  </p>

  <section>
    <h2><!-- Pregunta 1, ej: ¿A qué hora del día veo más Netflix? --></h2>
    <!-- RAWGraphs -->
    <object type="image/svg+xml" data="./viz.svg"></object>
    <p class="interpretacion"></p>
    <p class="fuente">Fuente: RAWGraphs</p>
  </section>

  <section>
    <h2><!-- Pregunta 2 --></h2>
    <!-- Flourish: pegar el embed (div.flourish-embed + script) -->
    <div class="viz-placeholder">Flourish</div>
    <p class="interpretacion"></p>
    <p class="fuente">Fuente: Flourish</p>
  </section>

  <section>
    <h2><!-- Pregunta 3 --></h2>
    <!-- DataWrapper: pegar el iframe de embed -->
    <div class="viz-placeholder">DataWrapper</div>
    <p class="interpretacion"></p>
    <p class="fuente">Fuente: DataWrapper</p>
  </section>

  <section>
    <h2><!-- Pregunta 4 --></h2>
    <!-- Tableau Public o Power BI: pegar el iframe de embed -->
    <div class="viz-placeholder">Tableau / Power BI</div>
    <p class="interpretacion"></p>
    <p class="fuente">Fuente: Tableau Public / Power BI</p>
  </section>

  <footer>
    <p class="fuente">Dataset: netflix_dataset_completo_2025_2026.csv</p>
  </footer>

</body>
</html>
